<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Menu | Harbour Bean Cafe</title>
  <meta name="description" content="Harbour Bean menu - coffee, food, and desserts. Fresh daily, prices may change.">
  <meta property="og:title" content="Menu | Harbour Bean Cafe">
  <meta property="og:description" content="Coffee, food, and desserts from a short kitchen list.">
  <meta property="og:image" content="assets/og.jpg">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>html.gate-lock body{visibility:hidden}</style>
  <script src="/access-gate.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="Menu">
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header site-header--solid">
    <div class="wrap site-header__inner">
      <a class="brand" href="index.html"><span class="brand__mark" aria-hidden="true"></span><span data-cafe-name>Harbour Bean</span></a>
      <button type="button" class="nav-toggle" data-nav-toggle aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav" id="site-nav" data-nav data-nav-panel aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="menu.html">Menu</a>
        <a href="contact.html">Contact</a>
        <a class="nav__cta" data-wa href="#" target="_blank" rel="noopener noreferrer">WhatsApp</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="menu-masthead" aria-labelledby="menu-title">
      <div class="menu-masthead__media" aria-hidden="true">
        <img src="assets/gallery-bar.jpg" alt="" width="1600" height="900" fetchpriority="high">
        <div class="menu-masthead__shade"></div>
      </div>
      <div class="wrap menu-masthead__content">
        <p class="eyebrow eyebrow--on-dark">Menu</p>
        <h1 id="menu-title">Coffee, food, desserts</h1>
        <p data-menu-note>A short list we cook fresh each day.</p>
      </div>
    </section>

    <section class="menu-mood" aria-hidden="true">
      <div class="wrap menu-mood__grid">
        <figure><img src="assets/gallery-coffee.jpg" alt="" loading="lazy" decoding="async"></figure>
        <figure><img src="assets/gallery-food.jpg" alt="" loading="lazy" decoding="async"></figure>
        <figure><img src="assets/gallery-dessert.jpg" alt="" loading="lazy" decoding="async"></figure>
      </div>
    </section>

    <section class="section" style="padding-top:28px" aria-label="Menu categories">
      <div class="wrap">
        <nav class="menu-tabs" data-menu-tabs aria-label="Menu sections"></nav>
        <div data-menu></div>
      </div>
    </section>

    <section class="cta-strip cta-strip--photo" aria-labelledby="menu-cta">
      <div class="cta-strip__bg" aria-hidden="true">
        <img src="assets/gallery-dessert.jpg" alt="" loading="lazy" decoding="async">
        <div class="cta-strip__shade"></div>
      </div>
      <div class="wrap cta-strip__inner">
        <div>
          <h2 id="menu-cta">Allergens or today’s specials?</h2>
          <p>Message us on WhatsApp — fastest reply during open hours.</p>
        </div>
        <a class="btn btn--wa" data-wa href="#" target="_blank" rel="noopener noreferrer">WhatsApp</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap site-footer__inner">
      <p><span data-cafe-name>Harbour Bean</span> &middot; &copy; <span data-year></span></p>
      <nav aria-label="Footer">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="/">Atlas Room</a>
      </nav>
    </div>
  </footer>

  <a class="wa-fab" data-wa href="#" target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp">
    <span class="wa-fab__icon" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.65 15.04L2 22l5.12-1.32A10 10 0 1 0 12 2zm0 1.8a8.2 8.2 0 0 1 6.9 12.42l-.3.46.5 1.94-1.96-.5-.45.28A8.2 8.2 0 1 1 12 3.8zm4.56 10.66c-.2-.1-1.18-.58-1.36-.65-.18-.07-.32-.1-.45.1-.13.2-.51.65-.63.78-.12.13-.23.15-.43.05-.2-.1-.84-.31-1.6-.99-.59-.53-.99-1.18-1.1-1.38-.12-.2-.01-.31.09-.41.09-.09.2-.23.3-.35.1-.12.13-.2.2-.33.07-.13.03-.25-.02-.35-.05-.1-.45-1.08-.62-1.48-.16-.39-.33-.33-.45-.34h-.38c-.13 0-.35.05-.53.25-.18.2-.7.68-.7 1.66s.72 1.92.82 2.05c.1.13 1.4 2.14 3.4 3 .48.21.85.33 1.14.42.48.15.91.13 1.25.08.38-.06 1.18-.48 1.35-.95.17-.47.17-.87.12-.95-.05-.08-.18-.13-.38-.23z"/></svg>
    </span>
    <span>WhatsApp</span>
  </a>

  <script src="config.js"></script>
  <script src="site.js"></script>
</body>
</html>
