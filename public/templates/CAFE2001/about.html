<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>About | Harbour Bean Cafe</title>
  <meta name="description" content="About Harbour Bean - careful coffee, a short kitchen, and an open door on Quay Lane, Fort Kochi.">
  <meta property="og:title" content="About | Harbour Bean Cafe">
  <meta property="og:description" content="A quiet harbour cafe for careful coffee and an open door.">
  <meta property="og:image" content="assets/og.jpg">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>html.gate-lock body{visibility:hidden}</style>
  <script src="/access-gate.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

<body data-page="About">
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header site-header--solid">
    <div class="wrap site-header__inner">
      <a class="brand" href="index.html"><span class="brand__mark" aria-hidden="true"></span><span data-cafe-name>Harbour Bean</span></a>
      <button type="button" class="nav-toggle" data-nav-toggle aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav" id="site-nav" data-nav data-nav-panel aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="menu.html">Menu</a>
        <a href="contact.html">Contact</a>
        <a class="nav__cta" href="menu.html">View menu</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <header class="about-hero">
      <div class="wrap about-hero__grid">
        <div class="about-hero__copy reveal">
          <p class="eyebrow">About</p>
          <h1 data-about-title>A quiet harbour cafe</h1>
          <p data-about-lead class="about-hero__lead"></p>
        </div>
        <figure class="about-hero__media reveal" style="--d:80ms">
          <img src="assets/about.jpg" alt="Friends sharing coffee at Harbour Bean" width="1600" height="1200" loading="eager" decoding="async">
        </figure>
      </div>
    </header>

    <section class="quote-band quote-band--soft" aria-label="Founding note">
      <div class="wrap quote-band__inner reveal">
        <p class="quote-band__mark" aria-hidden="true">“</p>
        <blockquote>
          <p>We opened for people who want a slower morning.</p>
        </blockquote>
        <p class="quote-band__attr">Quay Lane, Fort Kochi</p>
      </div>
    </section>

    <section class="section">
      <div class="wrap about-story">
        <div class="about-story__body reveal" data-about-body></div>
        <ul class="values values--cards reveal" data-about-values style="--d:90ms"></ul>
        <p class="about-story__cta reveal" style="--d:120ms">
          <a class="btn btn--sage" href="contact.html">Visit or message us</a>
          <a class="text-link" href="menu.html">Browse the menu</a>
        </p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap site-footer__inner">
      <p><span data-cafe-name>Harbour Bean</span> &middot; &copy; <span data-year></span></p>
      <nav aria-label="Footer">
        <a href="menu.html">Menu</a>
        <a href="contact.html">Contact</a>
        <a href="/">Atlas Room</a>
      </nav>
    </div>
  </footer>

  <script src="site.js"></script>
</body>
</html>
